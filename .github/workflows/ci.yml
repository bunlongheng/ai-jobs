name: ci
on: [push, pull_request]
defaults:
  run:
    working-directory: web
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Fail the build on any PRODUCTION vulnerability (what actually ships). Dev-tooling
      # advisories with no downstream fix are not build-blockers - runtime deps must be clean.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # E2E (Playwright) stays out of the fast per-push gate - it needs a running server and is
      # slow. Run it locally with `npm run test:e2e`, or wire a scheduled workflow for nightly.
