<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  body { font: 13px -apple-system, sans-serif; width: 360px; margin: 0; padding: 12px; color: #111; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  select, button { width: 100%; padding: 7px 8px; margin: 4px 0; font-size: 13px; box-sizing: border-box; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
  button.secondary { background: #e5e7eb; color: #111; }
  #status { margin: 6px 0; font-size: 12px; color: #6b7280; }
  #report { max-height: 260px; overflow: auto; font-size: 12px; border-top: 1px solid #e5e7eb; margin-top: 8px; }
  .row { padding: 3px 0; border-bottom: 1px solid #f3f4f6; }
  .manual { color: #dc2626; font-weight: 600; }
  .ok { color: #059669; }
  .badge { display: inline-block; min-width: 34px; margin-right: 6px; padding: 1px 5px; border-radius: 4px;
           background: #eef2ff; color: #4338ca; font-size: 10px; text-align: center; vertical-align: middle; }
</style></head>
<body>
  <h1><img src="icon32.png" width="20" height="20" style="vertical-align:-4px;margin-right:6px">JobFill <span id="ver" style="color:#9ca3af;font-weight:400;font-size:12px"></span></h1>
  <select id="kit"></select>
  <button id="fill">Fill this page</button>
  <button id="submitted" class="secondary">Mark submitted (backstop)</button>
  <button id="copy" class="secondary">Copy report for Claude</button>
  <div id="status">-</div>
  <div id="report"></div>
  <script src="popup.js"></script>
</body>
</html>
